name: Formatting

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm run install:ci
      - run: npm run format:check
